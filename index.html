<!doctype html>
<html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptBin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b12; --panel:#14151f; --panel2:#1a1c28; --border:#262838; --text:#eceefa; --muted:#7d84a0;
  --accent:#8c6bff; --accent2:#6f4de0; --danger:#ff5c72; --good:#33d69f; --warn:#ffb648;
  --mono:'JetBrains Mono','Courier New',monospace; --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f4fb; --panel:#ffffff; --panel2:#f1eef9; --border:#e2dff0; --text:#181a28; --muted:#5c6180; --accent:#6f4de0; --accent2:#5a3dc7;
  }
}
:root[data-theme="dark"]{ --bg:#0a0b12; --panel:#14151f; --panel2:#1a1c28; --border:#262838; --text:#eceefa; --muted:#7d84a0; --accent:#8c6bff; --accent2:#6f4de0; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);background:var(--panel);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10;}
header h1{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px;letter-spacing:.2px;}
.eyes{display:inline-flex;flex-shrink:0;}
.eyes svg{transform-origin:50% 50%;animation:blink 4.6s ease-in-out infinite;}
.eyes .eye{fill:var(--accent);}
.eyes .pupil{fill:var(--bg);}
@keyframes blink{0%,90%,100%{transform:scaleY(1);}94%{transform:scaleY(.15);}}
nav button{background:none;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;}
main{max-width:820px;margin:0 auto;padding:18px 14px 40px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
input[type=text],select{width:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:14px;margin-bottom:12px;}
textarea{width:100%;min-height:280px;padding:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;}
textarea.desc-input{min-height:70px;font-family:inherit;font-size:14px;}
input[type=file]{width:100%;padding:9px 10px;background:var(--bg);border:1px dashed var(--border);color:var(--muted);border-radius:8px;font-size:13px;margin-bottom:4px;}
.file-hint{font-size:11px;color:var(--muted);margin:0 0 12px;}
.paste-photo{max-width:100%;border-radius:8px;border:1px solid var(--border);display:block;margin-bottom:14px;}
.paste-desc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 14px;white-space:pre-wrap;}
.desc-snippet{font-size:12.5px;color:var(--muted);margin-top:3px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>div{flex:1;min-width:140px;}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn:active{background:var(--accent2);}
.btn.secondary{background:none;border:1px solid var(--border);color:var(--text);}
.btn.small{padding:6px 10px;font-size:12px;}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.paste-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer;}
.paste-item:last-child{border-bottom:none;}
.paste-item h3{margin:0 0 4px;font-size:15px;}
.paste-item .meta{font-size:12px;color:var(--muted);}
.badge{display:inline-block;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:2px 7px;border-radius:6px;margin-right:6px;}
.badge.status-nokey{background:rgba(51,214,159,.12);border-color:var(--good);color:var(--good);}
.badge.status-key{background:rgba(255,182,72,.14);border-color:var(--warn);color:var(--warn);}
.note-box{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5;color:var(--text);margin:0 0 14px;white-space:pre-wrap;}
pre.code-view{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0;}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
.toast.show{opacity:1;}
.hidden{display:none !important;}
.title-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.title-line h2{margin:0;font-size:17px;}
</style>
</head>
<body>
<header>
  <h1>SCRIPT ROBLOX</h1>
  <nav>
    <button id="navNew" class="active">Buat Baru</button>
    <button id="navBrowse">Jelajahi</button>
  </nav>
</header>
<main>

  <section id="viewNew" class="card">
    <div class="title-line"><h2>Tempel Script Baru</h2></div>
    <div id="newLocked" class="empty hidden">Hanya pemilik yang bisa menambahkan script baru di sini.</div>
    <div id="newFormFields">
    <label>Judul</label>
    <input type="text" id="pTitle" placeholder="cth: Auto Farm Script">
    <div class="row">
      <div>
        <label>Bahasa</label>
        <select id="pLang">
          <option value="lua">Lua</option>
          <option value="js">JavaScript</option>
          <option value="python">Python</option>
          <option value="cpp">C++</option>
          <option value="json">JSON</option>
          <option value="text">Plain Text</option>
        </select>
      </div>
      <div>
        <label>Nama Pengarang (opsional)</label>
        <input type="text" id="pAuthor" placeholder="anonim">
      </div>
      <div>
        <label>Status</label>
        <select id="pStatus">
          <option value="nokey">🆓 Tanpa Key</option>
          <option value="key">🔑 Pakai Key</option>
        </select>
      </div>
    </div>
    <label>Deskripsi (opsional)</label>
    <textarea id="pDesc" class="desc-input" placeholder="Jelaskan fungsi script ini..."></textarea>
    <label>Catatan (opsional)</label>
    <textarea id="pNote" class="desc-input" placeholder="Info tambahan, cara pakai, atau peringatan..."></textarea>
    <label>Link Download (opsional)</label>
    <input type="url" id="pLink" placeholder="https://www.mediafire.com/...">
    <label>Foto (opsional)</label>
    <input type="file" id="pPhoto" accept="image/*">
    <p class="file-hint">Tambahkan screenshot atau gambar pendukung.</p>
    <label>Isi Script</label>
    <textarea id="pBody" placeholder="-- tempel kode kamu di sini"></textarea>
    <div class="actions">
      <button class="btn" id="btnSave">Simpan &amp; Buat Link</button>
    </div>
    </div>
  </section>

  <section id="viewBrowse" class="card hidden">
    <div class="title-line"><h2>Script Terbaru</h2><button class="btn small secondary" id="btnRefresh">Muat Ulang</button></div>
    <div id="listArea"><div class="empty">Memuat...</div></div>
  </section>

  <section id="viewPaste" class="card hidden">
    <div class="title-line">
      <h2 id="vTitle">-</h2>
      <div class="actions" style="margin-top:0">
        <button class="btn small secondary" id="btnCopyScript">Salin Script</button>
        <button class="btn small secondary" id="btnCopyLink">Salin Link</button>
        <button class="btn small secondary" id="btnBack">← Kembali</button>
      </div>
    </div>
    <div class="meta" id="vMeta" style="margin-bottom:10px"></div>
    <a id="vLink" class="btn small hidden" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-bottom:14px;">⬇️ Buka Link Download</a>
    <img id="vPhoto" class="paste-photo hidden" alt="Foto pendukung script">
    <p id="vDesc" class="paste-desc hidden"></p>
    <div id="vNote" class="note-box hidden"></div>
    <pre class="code-view" id="vBody">-</pre>
  </section>

</main>
<div class="toast" id="toast"></div>

<script>
let db = null;
let assets = null;
let isOwner = false;
const $ = id => document.getElementById(id);
const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); };
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const genId = () => Math.random().toString(36).slice(2,9);
const statusInfo = s => s==='key' ? {label:'🔑 Pakai Key',cls:'status-key'} : {label:'🆓 Tanpa Key',cls:'status-nokey'};

function showView(name){
  ['New','Browse','Paste'].forEach(v=>{
    $('view'+v).classList.toggle('hidden', v!==name);
  });
  $('navNew').classList.toggle('active', name==='New');
  $('navBrowse').classList.toggle('active', name==='Browse');
}

async function init(){
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  try{ assets = await claude.use('assets'); }catch(e){ assets = null; }
  try{ const u = await claude.use('user'); isOwner = u ? (u.isOwner() ?? false) : false; }catch(e){ isOwner = false; }
  if(!isOwner){
    $('navNew').classList.add('hidden');
    $('newFormFields').classList.add('hidden');
    $('newLocked').classList.remove('hidden');
  }
  const hash = location.hash.replace('#','');
  if(hash){
    showView('Paste');
    loadPaste(hash);
  } else if(isOwner){
    showView('New');
  } else {
    showView('Browse');
    loadList();
  }
}

$('navNew').onclick = ()=>{ history.replaceState(null,'','#'); showView('New'); };
$('navBrowse').onclick = ()=>{ history.replaceState(null,'','#'); showView('Browse'); loadList(); };
$('btnBack').onclick = ()=>{ history.replaceState(null,'','#'); showView('Browse'); loadList(); };
$('btnRefresh').onclick = loadList;

$('btnSave').onclick = async ()=>{
  const title = $('pTitle').value.trim() || 'Tanpa Judul';
  const lang = $('pLang').value;
  const author = $('pAuthor').value.trim() || 'anonim';
  const status = $('pStatus').value;
  const description = $('pDesc').value.trim();
  const note = $('pNote').value.trim();
  const downloadLink = $('pLink').value.trim();
  const body = $('pBody').value;
  if(!body.trim()){ toast('Isi script kosong'); return; }
  if(!db){ toast('Penyimpanan tidak tersedia di tampilan ini'); return; }
  const file = $('pPhoto').files[0];
  let imageId = null;
  if(file){
    if(assets){
      try{ const up = await assets.upload(file); imageId = up.id; }
      catch(e){ toast('Foto gagal diunggah, script tetap disimpan'); }
    } else {
      toast('Unggah foto tidak tersedia, script tetap disimpan');
    }
  }
  const id = genId();
  try{
    await db.doc('pastes/'+id).set({ title, lang, author, status, description, note, downloadLink, imageId, body, createdAt: Date.now() });
    history.replaceState(null,'','#'+id);
    toast('Tersimpan! Link siap dibagikan');
    loadPaste(id);
    showView('Paste');
    $('pTitle').value=''; $('pAuthor').value=''; $('pDesc').value=''; $('pNote').value=''; $('pLink').value=''; $('pStatus').value='nokey'; $('pPhoto').value=''; $('pBody').value='';
  }catch(e){
    toast('Gagal menyimpan');
  }
};

async function loadPaste(id){
  $('vTitle').textContent = 'Memuat...';
  $('vBody').textContent = '';
  if(!db){ $('vTitle').textContent='Tidak tersedia'; return; }
  try{
    const snap = await db.doc('pastes/'+id).get();
    if(!snap || !snap.exists){ $('vTitle').textContent='Script tidak ditemukan'; $('vMeta').textContent=''; $('vPhoto').classList.add('hidden'); $('vDesc').classList.add('hidden'); $('vNote').classList.add('hidden'); $('vLink').classList.add('hidden'); return; }
    const d = snap.data();
    $('vTitle').textContent = d.title || 'Tanpa Judul';
    const st = statusInfo(d.status);
    $('vMeta').innerHTML = `<span class="badge ${st.cls}">${st.label}</span><span class="badge">${esc(d.lang||'text')}</span> oleh ${esc(d.author||'anonim')} &middot; ${new Date(d.createdAt||Date.now()).toLocaleString('id-ID')}`;
    const linkEl = $('vLink');
    if(d.downloadLink && /^https?:\/\//i.test(d.downloadLink)){ linkEl.href = d.downloadLink; linkEl.classList.remove('hidden'); } else { linkEl.removeAttribute('href'); linkEl.classList.add('hidden'); }
    const photoEl = $('vPhoto');
    if(d.imageId){ photoEl.src = '/_blob/'+d.imageId; photoEl.classList.remove('hidden'); } else { photoEl.classList.add('hidden'); }
    const descEl = $('vDesc');
    if(d.description){ descEl.textContent = d.description; descEl.classList.remove('hidden'); } else { descEl.classList.add('hidden'); }
    const noteEl = $('vNote');
    if(d.note){ noteEl.textContent = '📌 '+d.note; noteEl.classList.remove('hidden'); } else { noteEl.classList.add('hidden'); }
    $('vBody').textContent = d.body || '';
  }catch(e){
    $('vTitle').textContent = 'Gagal memuat';
  }
}

$('btnCopyScript').onclick = async ()=>{
  try{ await navigator.clipboard.writeText($('vBody').textContent); toast('Script disalin'); }
  catch(e){ toast('Gagal menyalin script'); }
};
$('btnCopyLink').onclick = async ()=>{
  try{ await navigator.clipboard.writeText(location.href); toast('Link disalin'); }
  catch(e){ toast('Gagal menyalin link'); }
};

async function loadList(){
  const area = $('listArea');
  area.innerHTML = '<div class="empty">Memuat...</div>';
  if(!db){ area.innerHTML = '<div class="empty">Penyimpanan tidak tersedia di tampilan ini.</div>'; return; }
  try{
    const col = db.collection('pastes').orderBy('createdAt','desc').limit(30);
    const snaps = await col.get();
    if(!snaps || snaps.empty){ area.innerHTML = '<div class="empty">Belum ada script. Jadilah yang pertama!</div>'; return; }
    area.innerHTML = '';
    snaps.docs.forEach(s=>{
      const d = s.data();
      const el = document.createElement('div');
      el.className = 'paste-item';
      const descHtml = d.description ? `<div class="desc-snippet">${esc(d.description).slice(0,90)}</div>` : '';
      const st = statusInfo(d.status);
      el.innerHTML = `<h3>${esc(d.title||'Tanpa Judul')}</h3><div class="meta"><span class="badge ${st.cls}">${st.label}</span><span class="badge">${esc(d.lang||'text')}</span>oleh ${esc(d.author||'anonim')} &middot; ${new Date(d.createdAt||Date.now()).toLocaleString('id-ID')}</div>${descHtml}`;
      el.onclick = ()=>{ history.replaceState(null,'','#'+s.id); showView('Paste'); loadPaste(s.id); };
      area.appendChild(el);
    });
  }catch(e){
    area.innerHTML = '<div class="empty">Gagal memuat daftar.</div>';
  }
}

init();
</script>


</body></html>
